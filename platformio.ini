; PlatformIO Project Configuration File
;
; Port: scripts/pick_serial_port.py skips Bluetooth. Or: pio device list
; zsh: bare globs error if nothing matches — use  pio device list  or  ls /dev/cu.*
;
; Editor "Arduino.h not found": firmware builds with `pio run`. For IntelliSense run
; `pio run -t compiledb` (see .clangd). VS Code + PlatformIO: "PlatformIO: Rebuild IntelliSense Index".
;
; WiFi credentials live in include/secrets.h (gitignored) — copy include/secrets_example.h
; to include/secrets.h and fill it in before building with -DENABLE_WIFI.
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_deps =
    ; Always required libraries (add any new shared dependencies here):
    plerup/EspSoftwareSerial @ ^8.2.0
    4-20ma/ModbusMaster @ 2.0.1                         ; Modbus RTU master (Sol-Ark polling)
    paulstoffregen/Time @ ^1.6.1

    ; Add conditional libraries here (comment out when the flag is off):
    ArduinoJson                                         ; JSON payload builder — required when ENABLE_MQTT is active.
    PubSubClient                                        ; MQTT client — required when ENABLE_MQTT is active.
    arduino-libraries/Ethernet @ ^2.0.0                 ; W5500 SPI Ethernet — required when ENABLE_ETHERNET is active.
    ;https://github.com/coryjfowler/MCP_CAN_lib.git      ; CAN bus library for MCP2515 — not used by the gateway.

build_flags =
    -DUSE_SOFTWARE_SERIAL

    ; EMS PCB revision for include/core/pins.h (exactly one):
    -DBOARD_VER_V3 ; Latest version of EMS, using NESL EMS PCBA v865B
    ;-DBOARD_VER_V1 ; legacy first version of EMS, handsoldered
    ;-DBOARD_VER_V2 ; legacy second version of EMS, modbus interface pins accidentally swapped

    ; Feature enable/disable flags (uncomment to enable):
    -DENABLE_OLED_DISPLAY      ; OLED SH1106 display + console UI
    ; Network interface — enable exactly ONE of the two lines below:
    -DENABLE_WIFI               ; WiFi connectivity
    ;-DENABLE_ETHERNET          ; W5500 SPI Ethernet via HR961160C (BOARD_VER_V3 only; mutually exclusive with ENABLE_WIFI)

    ; Ethernet addressing — DHCP is the default. Uncomment ENABLE_ETH_STATIC_IP
    ; for a fixed address (no DHCP round-trip at boot). Octets are comma-separated
    ; and must be quoted so the comma survives flag parsing.
    ;-DENABLE_ETH_STATIC_IP
    ;-DETH_STATIC_IP="192,168,1,129"
    ;-DETH_STATIC_GATEWAY="192,168,1,1"
    ;-DETH_STATIC_SUBNET="255,255,255,0"
    ;-DETH_STATIC_DNS="192,168,1,1"        ; defaults to ETH_STATIC_GATEWAY
    ;-DETH_MAC="0xDE,0xAD,0xBE,0xEF,0xFE,0x01"  ; unique per device on a shared segment
    ;-DETH_DHCP_TIMEOUT_MS=15000           ; DHCP-only; library default is 60000
    ;-DENABLE_MQTT              ; MQTT telemetry of Sol-Ark data (requires ENABLE_WIFI or ENABLE_ETHERNET)
    -DENABLE_MODBUS_MASTER      ; Modbus RTU master on RS485_1 — Sol-Ark inverter polling
    -DENABLE_MODBUS_TCP_SERVER  ; SunSpec Modbus TCP server (requires a network interface + ENABLE_MODBUS_MASTER)
    ;-DENABLE_RELAYS            ; Onboard SSR control
    ;-DENABLE_SD_CARD           ; SD card reader (SPI shared bus, BOARD_VER_V3 only)

    ; SD card logging options (uncomment to enable):
    ;-DENABLE_SD_SOLARK_LOG           ; Log Sol-Ark telemetry to /solark_log.csv (requires ENABLE_SD_CARD + ENABLE_MODBUS_MASTER)
    ;-DSD_SOLARK_LOG_INTERVAL_MS=60000 ; Log interval in ms (default 60 s)

    ; Override the SunSpec Modbus TCP listen port (default 8502):
    ;-DSUNSPEC_TCP_PORT=502

    ; Debugging flags (uncomment to enable):
    ;-DENABLE_SD_CARD_DEBUG    ; Print card type, size, and filesystem usage on boot
    -DENABLE_DEBUG            ; Debug logging

    ; Enable ARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Undefining it turns off printing and will not block when running on battery
    ;-UARDUINO_USB_CDC_ON_BOOT

; Build environment for the ESP32-S3 DevKitC-1 development board.
[env:esp32-s3-devkitc-1]
platform = espressif32          ; Espressif32 PlatformIO platform (toolchain + SDK for all ESP32 variants)
board = esp32-s3-devkitc-1      ; Target board — sets pin map, flash size, and chip variant
framework = arduino             ; Use Arduino framework (setup/loop) instead of raw ESP-IDF

lib_deps =
    ${common.lib_deps}                          ; Inherit shared libraries from [common]
    emelianov/modbus-esp8266 @ ^4.1.0           ; Modbus TCP server (ModbusIP) — ENABLE_MODBUS_TCP_SERVER

build_flags = ${common.build_flags}            ; Inherit compiler/preprocessor flags from [common]

board_build.partitions = huge_app.csv  ; Partition table giving ~3 MB to the app (default is ~1.4 MB)
upload_speed = 921600                  ; Fast serial baud rate for flashing firmware over USB
lib_ldf_mode = deep                    ; Recursively scan all library sources to resolve transitive dependencies
monitor_speed = 115200                 ; Serial monitor baud rate — must match Serial.begin() in firmware
; Avoid Bluetooth-Incoming-Port without hard-coding usbmodem (CH340/CP210x use other names).
extra_scripts = pre:scripts/pick_serial_port.py
; If upload still fails, plug the board and set an explicit port from `pio device list`:
; upload_port = /dev/cu.usbmodem1101
; monitor_port = /dev/cu.usbmodem1101
